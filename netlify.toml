[build]
  # Netlify cachea node_modules entre builds. Para que los binarios nativos de
  # lightningcss y @tailwindcss/oxide se bajen para la plataforma correcta
  # (linux x64), forzamos un install limpio con --include=optional. Sin esto,
  # los optionalDependencies se quedan vacíos y Turbopack falla con
  # "Cannot find native binding".
  #
  # IMPORTANTE: cuando definís `command` custom, Netlify NO agrega automáticamente
  # `npm run build` — hay que invocarlo explícitamente al final, o el plugin
  # falla con "Your publish directory was not found at: .next".
  command = "npm ci --include=optional && npm run build"
  publish = ".next"

[build.environment]
  # El plugin @netlify/plugin-nextjs 5.15.12 requiere Node 22 mínimo.
  # Si defines NODE_VERSION=20, el plugin avisa y puede fallar.
  NODE_VERSION = "22"
  NPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"